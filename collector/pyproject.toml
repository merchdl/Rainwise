[project]
name = "rainwise-collector"
version = "0.1.0"
description = "Polls a Rainwise IP-100, keeps history in SQLite and serves it to the iOS app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rainwise-collector = "rainwise_collector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rainwise_collector"]

[tool.pytest.ini_options]
pythonpath = ["."]
